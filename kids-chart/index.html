<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>

        <header>
            <a href="#">Chart Creator</a>
            <a href="#">Help</a>
        </header>

        <main>
            <!-- LEFT CONTAINER -->
            <div class="main-con-left">
                <!-- MAIN TITLE -->
                <img id="chart-logo-main" src="./media/main-page/chart-creator.png">
                <div class="mcl-sub">
                    <!-- Chart Selection Dropdown -->
                    <label>Select you chart theme:</label>
                    <select  id="chart-type-select" preview="">
                        <option value="behaviour" selected>Behaviour</option>
                        <option value="potty-training">Potty Training</option>
                    </select>
                </div>
                <div class="mcl-sub">
                    <label>Select your chart colour:</label>
                    <select id="chart-theme-select" preview="Select an option">
                        <option value="blue">Blue</option>
                        <option value="pink">Pink</option>
                    </select>
                </div>

                <div class="mcl-sub">
                    <!-- Child Name Input -->
                     <label>Child Name</label>
                    <input type="text" id="name-input" placeholder="">                    
                </div>



            </div>
            <!-- RIGHT CONTAINER -->
            <div class="main-con-right">
                <h2 class="temp-preview">PREVIEW WILL GO HERE!</h2>
            </div>

        </main>

        
        <footer>
            <p>Created by Luke - 2026</p>
        </footer>

        <script src="./script.jss" async defer></script>
    </body>
</html>
