<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>

        <header>
            <a href="#" class="header-a">Chart Creator</a>
            <a href="#" class="header-a">Help</a>
        </header>

        <main>
            <!-- LEFT CONTAINER -->
            <div class="main-con-left">
                <!-- MAIN TITLE -->
                <img id="chart-logo-main" src="./media/main-page/chart-creator.png">
                <div class="mcl-sub-con">
                    <div class="mcl-sub">
                        <!-- Chart Selection Dropdown -->
                        <label>Select you chart theme:</label>
                        <select  id="chart-theme-select" preview="" class="input-main">
                            <option value="behaviour" class="option-main" selected>Behaviour</option>
                            <option value="potty-training" class="option-main">Potty Training</option>
                        </select>
                    </div>
                    <div class="mcl-sub">
                        <label>Select your chart colour:</label>
                        <select id="chart-colour-select" preview="Select an option" class="input-main">
                            <option value="blue" class="option-main">Blue</option>
                            <option value="pink" class="option-main">Pink</option>
                        </select>
                    </div>

                    <div class="mcl-sub">
                        <!-- Child Name Input -->
                        <label>Childs Name:</label>
                        <input type="text" id="name-input" placeholder="" class="input-main">                    
                    </div>
                    <div class="button-con">
                        <button>Preview</button>
                        <button>Generate</button>
                    </div>
                </div>
            </div>


            <!-- RIGHT CONTAINER -->

            <div class="main-con-right">
                <h2 class="dp-font" style="font-size: xxx-large; margin:0px;">Your Chart Preview:</h2>
                <h2 class="temp-preview">PREVIEW WILL GO HERE!</h2>
            </div>

        </main>

        
        <footer>
            <p>Created by Luke - 2026</p>
        </footer>

        <script src="./script.js" async defer></script>
    </body>
</html>
