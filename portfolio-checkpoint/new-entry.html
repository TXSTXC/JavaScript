<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>New Entry</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">
        <link rel="stylesheet" href="./new-entry.css">
    </head>

        <header class="header-con">
            <div class="header-left">
                <span class="header-text-left">The Digital Vellum</span>

            </div>
            <div class="header-middle">
                <a href="./index.html" class="header-text">Home</a>

            </div>
            <div class="header-right">
                <a class="header-text" href="#">All Entries</a>
                <a class="header-text" href="#" style="border-bottom: 3px black solid; color: black;">New Entry</a>
                <a href="#"><img id="profile-icon" src="./media/profile-icon.png"></a>
            </div>
        </header>

        <form class="form-container">
            <div class="entry-top">
                <p>Wednesday, August 24 2026</p>
                <input class="entryField entrySubject" type="text" placeholder="Untitled Reflection">
                <div class="entry-top-tags">
                    <button class="tag-button">+ Add Tag</button>
                </div>
            </div>

            <div class="entry-middle">
                <textarea class="entryDesc" placeholder="Begin your reflection..."></textarea>
            </div>
            

            <div class="entry-bottom">
                <div class="entry-bot-l">
                    <div class="flex gap-10">
                        <img class="media-icon" src="./media/media-icon.png">
                        <span>Insert Memory</span>
                    </div>
                    <div class="flex gap-10">
                        <img class="lock-icon" src="./media/padlock-icon.png">
                        <span>Private</span>
                    </div>
                </div>

                <div class="entry-bot-r">               
                    <p>Discard</p>
                    <button type="submit" class="button saveEntry">Save Entry</button>
                </div>
            </div>


        </form>

        <footer class="footer">
            <p>
                &copy; 2026 My ITOL Vault. Designed by Luke Varga
            </p>
            <div class="foot-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Archive</a>
            </div>
        </footer>        
        
        <script src="./scripts.js" async defer></script>
    </body>
</html>
