<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./login.css">
    </head>

    <body>
        <div class="mobile-container">
                        <!-- Header -->
            <div class="header-con">
                <img class="logo" src="./media/lv-banking-logo.png" alt="Bank Logo">
                <img class="user-icon" src="./media/user-icon.jpg" alt="Profile Picture">
            </div>

            <div class="main-content">
                <div class="central-con">
                    <form class="login-form">
                        <input id="fullName" type="text" placeholder="Full Name" class="login-input" required>
                        <input id="password" type="password" placeholder="Password" class="login-input" required>
                        <button id="create-acc-btn" type="button" class="button">Create Account</button>
                        <button id="login-btn" type="button" class="button">Login</button>
                    </form>
                </div>

            </div>
        </div>
        
        <script src="./login.js" async defer></script>
    </body>
</html>
