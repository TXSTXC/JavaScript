<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <!-- Mobile Container -->
        <div class="mobile-container">
            <!-- Header -->
            <div class="header-con">
                <img class="logo" src="./media/bank-logo.jpg" alt="Bank Logo">
                <img class="user-icon" src="./media/user-icon.jpg" alt="Profile Picture">
            </div>
            <!-- Account Information -->
            <div class="account-con">
                <div class="acc-l1 acc-info">
                    <p class="acc-title">NAME:</p>
                    <p id="user-name" class="acc-value">Luke Varga</p>
                </div>
                <div class="acc-l2 acc-info">
                    <p class="acc-title">ACC NO:</p>
                    <p id="user-account-number" class="acc-value">59473945</p>
                </div>
                <div class="acc-l3 acc-info">
                    <p class="acc-title">SORT CODE:</p>
                    <p id="user-sort-code" class="acc-value">30-30-30</p>
                </div>
            </div>
            <!-- Balance -->
            <div class="balance-con">
                <p class="balance-title">CURRENT BALANCE:</p>
                <p id="user-balance" class="balance-value">£1,234.56</p>
            </div>
            <!-- Actions -->
            <div class="actions-con">
                <button id="transfer-btn" class="action-btn">Transfer</button>
                <button id="deposit-btn" class="action-btn">Deposit</button>
            </div>
            <div class="deposit-ui hidden">
                <input type="number" id="deposit-input" class="input-field" placeholder="Enter amount to deposit">
                <input type="text" id="deposit-description" class="input-field" placeholder="Enter description">
                <button id="deposit-submit-btn" class="submit-btn">Submit</button>
                <button id="deposit-cancel-btn" class="submit-btn">Cancel</button>
            
            </div>

            <div class="transfer-ui hidden">
                <input type="number" id="transfer-input" class="input-field" placeholder="Enter amount to transfer">
                <input type="text" id="transfer-description" class="input-field" placeholder="Enter description">
                <button id="transfer-submit-btn" class="submit-btn">Submit</button>
                <button id="transfer-cancel-btn" class="submit-btn">Cancel</button>
            </div>
            <!-- History -->
            <div class="history-con">
                <ul id="user-history">
                    <li>
                        <span></span>
                    </li>
                </ul>
            </div>
        </div>

        <script src="./script.js" defer></script>
    </body>
</html>
