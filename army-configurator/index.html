<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <!-- Main Content -->
        <div class="main-container">

            <!-- Left Column Container-->
            <div class="left-col-container">

                <!--WEAPON SELECTION-->
                <div class="option-container">
                    <label for="weapon-selection" class="select-title">Select Weapon</label>
                    <select id="weapon-selection" name="WeaponSelect">
                        <option value="">Select an option</option>
                        <option value="L85A3">L85A3 (SA80) - 5.56mm</option>
                        <option value="L403A1">L403A1 (KS1) - 5.56mm</option>
                        <option value="L7A2">L7A2 (FN MAG) - 7.62mm</option>
                    </select>
                </div>


                <!--OPTIC SELECTION-->
                <div class="option-container">
                    <label for="optic-selection" class="select-title">Select Optic</label>
                    <select id="optic-selection" name="OpticSelect">
                        <option value="">Select an option</option>
                        <option value="Eotech">Eotech HWS</option>
                        <option value="Aimpoint">Aimpoint Comp M4</option>
                    </select>
                </div>


                <!--UNDERBARREL ATTACHMENT-->
                <div class="option-container">
                    <label for="underbarrel-attachment" class="select-title">Select Underbarrel Attachment</label>
                    <select id="underbarrel-attachment" name="UnderbarrelAttachment">
                        <option value="">Select an option</option>
                        <option value="Foregrip">Foregrip</option>
                    </select>
                </div>
            </div>

            <!-- Right Column Container -->
            <div class="right-col-container">
                <div class="rc-top-container">
                    <img id="british-army-logo" src="./media/british-army-logo.png">
                    <p class="title-text">WEAPON CONFIGURATOR</p>
                </div>

                <div class="rc-bottom-container">
                    <!---  WEAPON INFO  --->
                    <div id="weapon-info" class="rc-bot-info">
                        <p id="weapon-name" class="rcbi-header">WEAPON INFO</p>
                        <p id="weapon-description"></p>
                        <img id="weapon-image" class="rcbi-image" src="">
                    </div>

                    <!--  OPTIC INFO  -->
                    <div id="optic-info" class="rc-bot-info">
                        <p id="optic-name" class="rcbi-header">OPTIC INFO</p>
                        <p id="optic-description" class=""></p>
                        <img id="optic-image" class="rcbi-image" src="">
                    </div>

                    <!--  UNDERBARREL ATTACHMENT INFO  -->
                    <div id="underbarrel-info" class="rc-bot-info">
                        <p id="underbarrel-name" class="rcbi-header">ATTACHMENT INFO</p>
                        <p id="underbarrel-description" class=""></p>
                        <img id="underbarrel-att-image" class="rcbi-image" src="">
                    </div>

                </div>
            </div>
        </div>
        
        <script src="./script.js"></script>
    </body>
</html>
