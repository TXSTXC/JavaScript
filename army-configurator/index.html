<!DOCTYPE html>

<html>

        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./styles.css">

    <body>
        <!-- Main Content -->
        <div class="main-container">

            <!-- Left Column Container-->
            <div class="left-col-container">

                <!--WEAPON SELECTION-->
                <div class="option-container">
                    <label for="weapon-selection" class="select-title">Select Weapon</label>
                    <select id="weapon-selection" name="WeaponSelect">
                        <option value="">Select an option</option>
                        <option value="weapon">L85A3 (SA80) - 5.56mm</option>
                        <option value="weapon">L403A1 (KS1) - 5.56mm</option>
                        <option value="weapon">L7A2 (FN MAG) - 7.62mm</option>
                    </select>
                </div>


                <!--OPTIC SELECTION-->
                <div class="option-container">
                    <label for="optic-selection" class="select-title">Select Optic</label>
                    <select id="optic-selection" name="OpticSelect">
                        <option value="">Select an option</option>
                        <option value="optic">ACOG</option>
                        <option value="optic">Holo sight</option>
                        <option value="optic">Red dot sight</option>
                    </select>
                </div>


                <!--UNDERBARREL ATTACHMENT-->
                <div class="option-container">
                    <label for="underbarrel-attachment" class="select-title">Select Underbarrel Attachment</label>
                    <select id="underbarrel-attachment" name="UnderbarrelAttachment">
                        <option value="">Select an option</option>
                        <option value="underbarrel">Foregrip</option>
                    </select>
                </div>

            </div>

            <!-- Right Column Container -->
            <div class="right-col-container">
                <div class="rc-top-container">
                    <img id="british-army-logo" src="./media/british-army-logo.png">
                    <p class="title-text">WEAPON CONFIGURATOR</p>
                </div>

                <div class="rc-bottom-container">
                    <div>
                        <p>WEAPON</p>

                    <div>
                        <p>UNDERBARREL ATTACHMENT</p>
                        <img src="">
                    </div>
                </div>
            </div>
        </div>
