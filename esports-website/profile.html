<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./profile-styles.css">
        <link rel="stylesheet" href="./styles.css">

    </head>
    <body>



                <!-- Main Mobile Screen Container -->
        <div class="mobile-container">

            <!-- Header Container -->
            <div class="header-container">
                <img src="./media/logo-and-text-png.png" alt="banner logo" class="banner-logo">
                <a href="https://discord.com" target="_blank"><img src="./media/icons/discord-icon.png" class="header-icon"></a>
                <img src="./media/burger-menu-icon.png" alt="burger menu" class="burger-icon">
            </div>

            <!-- PROFILE NAME + IMAGE -->
            <div class="profile-header">
                <h1 class="profile-name">TXSTXC</h1>
                <img src="./media/icons/user-pic.jpg" class="profile-pic">
            </div>

            <hr class="hr-divider">

            <!-- DISPLAYS HIGHLIGHTED STATS FOR PROFILE -->
            <div class="stats-container">
                <p class="stats-h2">Highlighted Stats</p>
                <div class="stat-highlight-blocks">
                    <div class="stat-highlighted">
                        <p class="stat-highlighted-game">Game: <span class="highlighted-game-span">HALO Infinite</span></p>
                        <p class="stat-highlighted-title">Games Played:</p>
                        <p class="highlighted-game-span">100</p>
                    </div>
                    <div class="stat-highlighted">
                        <p class="stat-highlighted-game">Game: <span class="highlighted-game-span">HALO Infinite</span></p>
                        <p class="stat-highlighted-title">Win Rate:</p>
                        <p class="highlighted-game-span">75%</p>
                    </div>
                    <div class="stat-highlighted">
                        <p class="stat-highlighted-game">Game: <span class="highlighted-game-span">Battlefield 6</span></p>
                        <p class="stat-highlighted-title">K/D Ratio:</p>
                        <p class="highlighted-game-span">3.8</p>
                    </div>                    
                    <div class="stat-highlighted">
                        <p class="stat-highlighted-game">Game: <span class="highlighted-game-span">LoL</span></p>
                        <p class="stat-highlighted-title">Tournaments Entered:</p>
                        <p class="highlighted-game-span">6</p>
                    </div>
                </div>
            </div>

            <hr class="hr-divider">

            <!-- ACTIVE TEAMS -->
            <div class="profile-teams-container">
                <p class="stats-h2">Active Teams</p>
                <div class="team-container">
                    <img class="profile-team-image" src="./media/icons/MASCOT WITH BG.jpg">
                    <div class="profile-team-sub-container">
                        <p class="profile-team-name">ETHEREAL esports</p>
                        <p class="profile-team-stat">Game: HALO Infinite</p>
                        <p class="profile-team-stat">Wins: 18</p>
                        <p class="profile-team-stat">Losses: 11</p>
                    </div>

                </div>
            </div>




























            <!-- FOOTER --> 
             <footer class="footer-container">
                <a href="./index.html" class="footer-btn" style="filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.8));">
                    <img src="./media/icons/home.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-home">HOME</p>
                </a>
                <a href="./search.html" class="footer-btn">
                    <img src="./media/icons/search (1).png" class="footer-btn-image">
                    <p class="footer-btn-text btn-search">SEARCH</p>
                </a>
                <a href="./tournaments.html" class="footer-btn">
                    <img src="./media/icons/trophy.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-tournaments">TOURNAMENTS</p>
                </a>
                <a href="./profile.html" class="footer-btn">
                    <img src="./media/icons/user.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-profile">PROFILE</p>
                </a>
             </footer>
        </div>
        
        <script src="./scripts.js" async defer></script>
    </body>
</html>
