<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./search-styles.css">
        <link rel="stylesheet" href="./styles.css">

    </head>
    <body>



                <!-- Main Mobile Screen Container -->
        <div class="mobile-container">
            <!-- Header Container -->
            <div class="header-container">
                <img src="./media/logo-and-text-png.png" alt="banner logo" class="banner-logo">
                <a href="https://discord.com" target="_blank"><img src="./media/icons/discord-icon.png" class="header-icon"></a>
                <img src="./media/burger-menu-icon.png" alt="burger menu" class="burger-icon">
            </div>





            <!-- SECTION FOR MAIN TEXT & ICONS -->
            <div class="main-options-container">

                <div class="main-option-1">
                    <p class="main-option-text">TEAM UP</p>
                    <img class="main-option-icon" src="./media/icons/teamup-icon.png">
                </div>
                <div class="main-option-2">
                    <img class="main-option-icon" src="./media/icons/compete-icon.png">
                    <p class="main-option-text">COMPETE</p>
                </div>
                <div class="main-option-3">
                    <p class="main-option-text">DOMINATE</p>
                    <img class="main-option-icon" src="./media/icons/dominater-icon.png">
                </div>
             
            </div>

            

            <!-- CONTAINER FOR SEARCH BUTTONS -->
            <div class="search-options-container">
                <button id="create-lobby-btn" class="search-sub-container create-lobby-container">
                    <p class="search-text">Create a Lobby</p>
                    <p class="search-text-sub">Friends Online:<span class="search-text-sub-count">2</span></p>
                </button>                
                <button id="player-finder-btn" class="search-sub-container search-players-container">
                    <p class="search-text">Player Finder</p>
                    <p class="search-text-sub">Active Players:<span class="search-text-sub-count">45,934</span></p>
                </button>
                <button id="search-games-container" class="search-sub-container search-games-container">
                    <p class="search-text">Match Finder</p>
                    <p class="search-text-sub">Pending Matches:<span class="search-text-sub-count">1,853</span></p>
                </button>
            </div>

                <!-- CONTAINERS FOR FILTERS -->

                <!-- CREATE LOBBY CONTAINER -->
            <div class="create-lobby-search-container hidden">
                <select class="search-dropdown" name:="search-game-select" id="search-game-select">
                    <option value="" selected disabled hidden>Game Select</option>
                    <option>HALO Infinite</option>
                    <option>Call of Duty: B07</option>
                    <option>BATTLEFIELD: 6</option>
                    <option>League of Legends</option>
                    <option>Rocket League</option>
                    <option>PUBG</option>
                </select>
                <select class="search-dropdown" name="search-region-select" id="search-region-select">
                    <option value="" selected disabled hidden>Region Select</option>
                    <option>United Kingdom</option>
                    <option>Europe</option>
                    <option>US: East</option>
                    <option>US: West</option>
                    <option>ASIA</option>
                </select>
                <select class="search-dropdown" name="search-visibility" id="search-visibility-select">
                    <option value="" selected disabled hidden>Lobby Visibility</option>
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                </select>
                <p class="search-dropdown hidden" id="code-generator" class="code-generator hidden">Lobby Code: <span id="search-lobby-code" class="search-lobby-code"></span></p>

                <div class="search-game-container">
                    <img id="search-game-selection-img" class="search-game-selection-img" src="">
                    <img id="search-region-selection-img" class="search-region-selection-img" src="">
                </div>

                <!-- Cancel and Create Container -->
                <div class="create-lobby-search-lower-btn-container">
                    <button id="lobby-search-cancel-button" class="search-lobby-cancel-btn">Cancel</button>
                    <button id="lobby-search-create-btn" class="search-lobby-btn">Create</button>
                </div>

            </div>

            <!-- SEARCH PLAYERS CONTAINER -->
            <div class="search-players-search-container hidden">


                <button id="player-search-cancel-button"  class="search-cancel-btn">Cancel</button>
            </div>
            <!-- MATCH FINDER CONTAINER -->
            <div class="match-finder-search-container hidden">


                <button id="match-search-cancel-button"  class="search-cancel-btn">Cancel</button>
            </div>






                <!-- RECENT PLAYERS LIST -->
            <div class="search-recent-players-container">
                            <!--RECENTS LIST-->
                <div class="friends-list-text-container">
                    <p class="fl-header-text">Recent Players</p>
                    <p class="fl-sub-header-text">Select a fplayer to view their profile.</p>
                </div>
                <table class="friends-table">
                    <tr class="recent-player-item">
                        <td><img class="player-avatar" src=".//media/icons/blobby.jpg"></td>
                        <td class="player-name">Blobmeister</td>
                        <td><span class="status-dot online"></span></td>
                        <td><svg class="player-msg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></td>
                        <td><img class="player-add" src="./media/icons/plus-icon.png"></td>
                    </tr>

                    <tr class="recent-player-item">
                        <td><img class="player-avatar" src="./media/icons/mlg.jpg"></td>
                        <td class="player-name">ProPlayer456</td>
                        <td><span class="status-dot online"></span></td>
                        <td><svg class="player-msg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></td>
                        <td><img class="player-add" src="./media/icons/plus-icon.png"></td>
                    </tr>

                    <tr class="recent-player-item">
                        <td><img class="player-avatar" src="./media/icons/pepe.jpg"></td>
                        <td class="player-name">NoobMaster789</td>
                        <td><span class="status-dot offline"></span></td>
                        <td><svg class="player-msg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></td>
                        <td><img class="player-add" src="./media/icons/plus-icon.png"></td>
                    </tr>
                </table>
            </div>




















            <!-- FOOTER --> 
             <footer class="footer-container">
                <a href="./index.html" class="footer-btn">
                    <img src="./media/icons/home.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-home">HOME</p>
                </a>
                <a class="footer-btn">
                    <img src="./media/icons/search (1).png" class="footer-btn-image" style="filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.8));">
                    <p class="footer-btn-text btn-search">SEARCH</p>
                </a>
                <a href="./tournaments.html" class="footer-btn">
                    <img src="./media/icons/trophy.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-tournaments">TOURNAMENTS</p>
                </a>
                <a href="./profile.html" class="footer-btn">
                    <img src="./media/icons/user.png" class="footer-btn-image">
                    <p class="footer-btn-text btn-profile">PROFILE</p>
                </a>
             </footer>
        </div>
        
        <script src="./search-scripts.js"></script>
    </body>
</html>
