<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Book Array</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>


        <header class="header">
            <button id="theme-toggle" class="button">Toggle Theme</button>
        </header>

        <h1>Your list of books</h1>

        <div id="arrayContainer" class="arrayContainer">
            <ul id="bookList" class="bookList">

            </ul>

        </div>

        <div class="button-container">
            <div class="input-container">
                <input type="text" id="bookInput" placeholder="Type a book title">
                <button id="bookUnshift" class="button">Add Book to Start</button>
                <button id="bookPush" class="button">Add Book to End</button>      
            </div>

                <button id="bookShift" class="button">Remove First Book</button>
                <button id="bookPop" class="button">Remove Last Book</button>

            <div class="input-container">
                <input type="text" id="spliceInput" placeholder="Type a book title">
                <button id="bookSplice" class="button">Remove Book by Index</button>
            </div>

            <!-- BOOK PICKER -->
            <div class="book-picker-container">
                <button id="book-picker-btn" class="button">Pick a Book to read!</button>
                <ul id="book-picker-list" class="book-picker-list">

                </ul>
            </div>

            <div class="filter-container">
                <input type="text" id="filter-input" placeholder="Insert number to filter">
                <button id="filter-btn" class="button">Filter</button>

            </div>

            
        </div>
        <script src="./script.js" async defer></script>
    </body>
</html>
