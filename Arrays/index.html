<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Book Array</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>


        <h1>Your list of books</h1>

        <div>
            <input type="text" id="bookInput" placeholder="Type a book title">
            <button id="bookPush">Add Book to End</button>

            <button id="bookPop">Remove Last Book</button>

            <button id="bookShift">Remove First Book</button>

            <button id="bookUnshift">Add Book to Start</button>

            <button id="bookSplice">Remove Book by Index</button>

            <div id="arrayElements"></div>

            
        </div>



        
        <script src="./script.js" async defer></script>
    </body>
</html>
